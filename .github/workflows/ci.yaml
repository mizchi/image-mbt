name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [js, native, wasm, wasm-gc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      # The js AVIF tests shell out to ffmpeg (encode) and ffprobe (check).
      # A static build from GitHub Releases is cached between runs; apt
      # (whose mirrors have stalled CI for 8+ minutes) is only a fallback
      # when the download fails.
      - name: Cache ffmpeg
        if: matrix.target == 'js'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-master-linux64-gpl-v2
      - name: Download ffmpeg
        if: matrix.target == 'js' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        id: ffmpeg-download
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p ~/ffmpeg
          curl -fsSL --retry 3 --retry-delay 5 --max-time 120 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C ~/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          ~/ffmpeg/ffmpeg -hide_banner -version | head -1
          ~/ffmpeg/ffprobe -hide_banner -version | head -1
      - name: Install ffmpeg from apt (fallback)
        if: matrix.target == 'js' && steps.ffmpeg-cache.outputs.cache-hit != 'true' && steps.ffmpeg-download.outcome != 'success'
        timeout-minutes: 8
        run: |
          rm -rf ~/ffmpeg
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Check ffmpeg
        if: matrix.target == 'js'
        run: |
          if [ -x ~/ffmpeg/ffmpeg ] && [ -x ~/ffmpeg/ffprobe ]; then echo "$HOME/ffmpeg" >> "$GITHUB_PATH"; fi
          export PATH="$HOME/ffmpeg:$PATH"
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1
          ffmpeg -hide_banner -encoders | grep -i av1
      - name: Moon update
        run: moon update
      - name: Moon check
        run: moon check --deny-warn --target ${{ matrix.target }}
      - name: Moon test
        run: moon test --target ${{ matrix.target }}
