name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [js, native, wasm, wasm-gc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install AVIF test tools
        if: matrix.target == 'js'
        # apt mirrors occasionally hang; fail fast instead of blocking CI.
        timeout-minutes: 8
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Moon update
        run: moon update
      - name: Moon check
        run: moon check --deny-warn --target ${{ matrix.target }}
      - name: Moon test
        run: moon test --target ${{ matrix.target }}
